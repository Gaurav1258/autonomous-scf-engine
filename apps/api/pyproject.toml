[project]
name = "scf-api"
version = "0.1.0"
description = "FastAPI gateway: REST endpoints, SSE agent telemetry stream, and one-click approval actions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "scf-orchestrator",
    "scf-mcp-server",
]

[tool.uv.sources]
scf-orchestrator = { workspace = true }
scf-mcp-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
