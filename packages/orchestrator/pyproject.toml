[project]
name = "scf-orchestrator"
version = "0.1.0"
description = "LangGraph multi-agent orchestrator, XGBoost ML engine, and GCS data layer for the SCF engine"
requires-python = ">=3.11"
dependencies = [
    # GCP
    "google-cloud-storage>=2.19",
    "google-genai>=2.28",
    # ML
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=2.1",
    # Data gen
    "faker>=28.0",
    # LangGraph orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    # Data contracts
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

