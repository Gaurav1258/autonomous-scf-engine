[project]
name = "scf-mcp-server"
version = "0.1.0"
description = "FastMCP tool server: Trade Ledger Normalizer, Working Capital Math Solver, Guardrail Validator"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3",
    "rapidfuzz>=3.10",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

